name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke the CLI
        run: |
          node bin/dsh-ltm.mjs --help
          T="$(mktemp -d)"
          # `import` validates strictly and only accepts records shaped like
          # `export` output, so the smoke fixture carries every field.
          printf '{"format":"dsh-ltm-export/1","records":[{"id":1,"text":"CI smoke 记忆","tags":"ci","scope":"","pinned":false,"createdAt":1,"updatedAt":1,"lastConfirmedAt":1}]}' > "$T/in.json"
          node bin/dsh-ltm.mjs --db "$T/ltm.db" import "$T/in.json" | grep -q 'imported 1'
          node bin/dsh-ltm.mjs --db "$T/ltm.db" search "记忆" | grep -q 'CI smoke'

  pack:
    # Publishes are manual, but the files whitelist is easy to break silently.
    # Fail early when the packed tarball no longer matches expectations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and assert contents
        run: |
          pnpm pack --pack-destination .
          shopt -s nullglob
          tarballs=(*dsh-ltm-*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            printf 'expected exactly one dsh-ltm tarball, got %s\n' "${#tarballs[@]}" >&2
            exit 1
          fi
          tar tzf "${tarballs[0]}" > packed.txt
          # Compare exact contents with this build's emitted chunks, not a
          # particular source-module prefix or an ignored class of files.
          node --test .github/scripts/check-packed.cases.mjs
          node .github/scripts/check-packed.mjs packed.txt
      - name: Clean up pack artifacts
        if: always()
        run: rm -f *dsh-ltm-*.tgz packed.txt
