# The dsh-ltm bundle patch: one row inserted over whatever layers came before
# it. A patch replaces the targeted row's whole `config`, so a profile
# overriding this row must restate every key it wants to keep.
#
# `path` has no code-side default on purpose — a durable store of user facts
# must not land in whatever directory the harness happened to start in. The
# deployment value lives here, beside the row, resolved through the loader's
# `dshHomePath` so every profile on this machine shares one memory file.
# This is a NEW database, independent of the legacy dsh-memory
# `memory/memory.db`; populate it with `dsh-ltm migrate` and leave the old
# file untouched as the rollback copy.

- insert:
    - id: ltm
      name: '@tr1v3r/dsh-ltm'
      config:
        path: !!js dshHomePath('memory/ltm.db')
        defaultScope: ''
        promptRecentCount: 10
        promptMaxChars: 2000
        maxTextChars: 2000
        searchLimitDefault: 10
        searchLimitMax: 50
        promptOrder: 50
        dedupeThreshold: 0.8
        dedupeCosineThreshold: 0.92
        staleAfterDays: 90
